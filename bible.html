<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f5f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171211" media="(prefers-color-scheme: dark)">
<title>Библия · Bible · Biblija</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prata&family=PT+Sans:wght@400;700&family=PT+Serif:ital@0;1&display=swap">
<style>
/* Layout: library (books → chapter chips) and a reader (verse text) that swap on phones and sit side by side on wide screens; one fixed player at the bottom. */
:root{
  --bg:#f8f5f3;--surface:#ffffff;--fg:#231c1a;--muted:#6f6360;--line:#e4dbd7;--soft:#f1ebe8;
  --ru:#a8241c;--ru-soft:#f3dedb;--en:#2f5d8a;--en-soft:#dde8f3;--lt:#7a5a08;--lt-soft:#f3e9cf;--done:#3f6b4a;
  --display:"Prata","PT Serif",Georgia,serif;--body:"PT Sans","Segoe UI",Arial,sans-serif;--read:"PT Serif",Georgia,serif;
  --player-h:118px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#171211;--surface:#211a19;--fg:#efe7e4;--muted:#a89995;--line:#3a2f2d;--soft:#2a2220;
  --ru:#e2685d;--ru-soft:#3d2321;--en:#7fb0e0;--en-soft:#1f2c3a;--lt:#e0bf6a;--lt-soft:#352c16;--done:#7fb38b;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);-webkit-text-size-adjust:100%;touch-action:manipulation;
  padding-bottom:calc(var(--player-h) + env(safe-area-inset-bottom,0px))}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;min-height:40px}
button.icon{min-width:40px;padding:6px 10px;font-size:18px;line-height:1}
button.primary{background:var(--ru);border-color:var(--ru);color:#fff;font-weight:700}
button:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--en);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
small,.muted{color:var(--muted)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
/* top bar */
.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .in{display:flex;align-items:center;gap:8px;padding-block:8px;max-width:1100px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.top h1{font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 b{color:var(--ru);font-weight:400}
.prog{height:4px;background:var(--line)}
.prog i{display:block;height:100%;width:0;background:var(--ru);transition:width .3s}
/* two-pane on wide screens */
.panes{display:grid;grid-template-columns:1fr;gap:0}
@media (min-width:900px){.panes{grid-template-columns:minmax(320px,420px) 1fr;gap:28px;align-items:start}
  #lib{position:sticky;top:60px;max-height:calc(100vh - 60px - var(--player-h));overflow:auto;padding-right:8px}
  .mobile-only{display:none!important}}
@media (max-width:899px){.panes>section[data-hide]{display:none}}
/* continue card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:14px 0;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.card .t{flex:1 1 180px;min-width:0}
.card .t b{display:block;font-size:16px}
/* sections & books */
details.sec{border-top:1px solid var(--line)}
details.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:10px;padding:12px 0;min-height:44px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary h2{font-size:19px;flex:1}
details.sec>summary .cnt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
details.sec>summary::before{content:"▸";color:var(--muted);font-size:13px;transition:transform .15s}
details.sec[open]>summary::before{transform:rotate(90deg)}
.book{border-top:1px dashed var(--line);padding:6px 0}
.book .row{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;padding:4px 0}
.book .nm{flex:1;min-width:0}
.book .nm b{display:block;font-size:15px}
.book .nm small{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book .st{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.book .st.done{color:var(--done);font-weight:700}
.avail{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.avail i{display:inline-block;width:8px;height:8px;border-radius:50%;opacity:.35}
.avail i.on{opacity:1}
.avail i.ru{background:var(--ru)}.avail i.en{background:var(--en)}.avail i.lt{background:var(--lt)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 10px}
.ch{min-width:42px;min-height:40px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-variant-numeric:tabular-nums;font-size:14px;position:relative}
.ch.done{border-style:dashed;color:var(--muted);background:transparent}
.ch.now{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.ch[data-best]::after{content:"";position:absolute;right:3px;top:3px;width:6px;height:6px;border-radius:50%}
.ch[data-best=ru]::after{background:var(--ru)}.ch[data-best=en]::after{background:var(--en)}.ch[data-best=lt]::after{background:var(--lt)}
.ch.hasq{text-decoration:underline dotted}
/* reader */
#reader{padding-top:10px}
.rhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.rhead h2{font-size:22px;flex:1 1 200px;min-width:0}
.rhead .sub{width:100%;font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:6px;margin:8px 0 12px;flex-wrap:wrap}
.tabs button{padding:8px 14px;border-radius:999px;font-weight:700;font-size:13px;letter-spacing:.04em}
.tabs button.ru.on{background:var(--ru);border-color:var(--ru);color:#fff}
.tabs button.en.on{background:var(--en);border-color:var(--en);color:#fff}
.tabs button.lt.on{background:var(--lt);border-color:var(--lt);color:#fff}
.tabs button[disabled]{opacity:.4;cursor:default}
.ubest{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:10px}
.ubest button{min-height:32px;padding:4px 10px;font-size:12px;font-weight:700;border-radius:6px}
.ubest button.ru.on{background:var(--ru);border-color:var(--ru);color:#fff}
.ubest button.en.on{background:var(--en);border-color:var(--en);color:#fff}
.ubest button.lt.on{background:var(--lt);border-color:var(--lt);color:#fff}
.text{font-family:var(--read);font-size:18px;line-height:1.62;max-width:68ch}
.text h3{font-family:var(--display);font-size:17px;margin:14px 0 6px;color:var(--muted)}
.v{padding:3px 6px;border-radius:6px;margin-left:-6px;cursor:pointer}
.v:active,.v.sel{background:var(--soft)}
.v sup{font-family:var(--body);font-size:11px;color:var(--muted);margin-right:4px;font-weight:700}
.v.missing{color:var(--muted);font-style:italic;font-size:15px}
.v[data-best=ru]{box-shadow:inset 3px 0 0 var(--ru)}.v[data-best=en]{box-shadow:inset 3px 0 0 var(--en)}.v[data-best=lt]{box-shadow:inset 3px 0 0 var(--lt)}
.v.hasq sup{color:var(--ru)}
.vact{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 10px 0;font-family:var(--body);font-size:13px}
.vact button{min-height:34px;padding:4px 10px;font-size:12px;font-weight:700;border-radius:6px}
.vact button.ru.on{background:var(--ru);border-color:var(--ru);color:#fff}
.vact button.en.on{background:var(--en);border-color:var(--en);color:#fff}
.vact button.lt.on{background:var(--lt);border-color:var(--lt);color:#fff}
.rnav{display:flex;gap:8px;margin:18px 0 8px}
.rnav button{flex:1}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding:4px 10px;margin:10px 0}
/* player */
.player{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.14);
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
.player .in{max-width:1100px;margin:0 auto}
.np{display:flex;align-items:center;gap:8px;min-height:40px}
.np .lang{flex:none;font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 7px;border-radius:5px;background:var(--soft);color:var(--muted)}
.np .lang.ru{background:var(--ru-soft);color:var(--ru)}.np .lang.en{background:var(--en-soft);color:var(--en)}.np .lang.lt{background:var(--lt-soft);color:var(--lt)}
.np .tt{flex:1;min-width:0;line-height:1.25}
.np .tt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.np .tt small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.ctl{display:flex;align-items:center;gap:6px}
.ctl button{min-width:44px;min-height:40px;font-size:18px;padding:4px}
.ctl button.big{min-width:52px;font-size:22px;background:var(--ru);border-color:var(--ru);color:#fff}
.seek{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.seek input{flex:1;min-width:0;accent-color:var(--ru);height:28px;margin:0}
.more{display:none;flex-wrap:wrap;gap:8px 14px;padding:8px 0 2px;border-top:1px solid var(--line);margin-top:6px;font-size:13px;color:var(--muted)}
.player.open .more{display:flex}
.more label{display:inline-flex;align-items:center;gap:6px}
.more select{min-height:36px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 6px}
/* sheet (modal) */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);border-radius:16px 16px 0 0;max-height:85vh;overflow:auto;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.sheet{left:50%;right:auto;transform:translateX(-50%);width:640px;bottom:5vh;border-radius:16px}}
.sheet h2{font-size:20px;margin-bottom:8px}
.sheet .x{position:absolute;right:10px;top:10px}
.sheet textarea,.sheet input[type=text]{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);resize:vertical}
.qs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.qs li{border-bottom:1px solid var(--line);padding-bottom:8px}
.qs .ref{font-weight:700;color:var(--ru)}
.qs .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.qs .acts a,.qs .acts button{font-size:12px;font-weight:700;padding:6px 10px;min-height:34px;border-radius:6px;text-decoration:none;display:inline-flex;align-items:center}
.qs .acts a{background:var(--ru);color:#fff}
.stat{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:8px 0}
.stat b{color:var(--fg)}
.foot{font-size:12.5px;color:var(--muted);margin:24px 0 8px;max-width:72ch}
.toast{position:fixed;left:50%;bottom:calc(var(--player-h) + 12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:60;font-size:14px;max-width:90vw}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="in">
    <button class="icon mobile-only" id="backBtn" hidden aria-label="Back to books">‹</button>
    <h1><b>Б</b>иблия · Bible · Biblija</h1>
    <button class="icon" id="notesBtn" title="My questions" aria-label="My questions">✎</button>
    <button class="icon" id="setBtn" title="Settings" aria-label="Settings">⚙</button>
  </div>
  <div class="prog"><i id="prog"></i></div>
</header>

<main class="wrap panes">
  <section id="lib">
    <div class="card" id="cont"></div>
    <div id="sections"></div>
    <p class="foot" id="credits"></p>
  </section>
  <section id="reader" data-hide>
    <div class="rhead"><h2 id="rTitle">—</h2><div class="sub" id="rSub"></div></div>
    <div class="tabs" id="tabs"></div>
    <div class="ubest" id="ubest"></div>
    <div class="text" id="text"></div>
    <div class="rnav"><button id="prevCh">‹ Previous</button><button id="nextCh">Next ›</button></div>
  </section>
</main>

<div class="player" id="player">
  <div class="in">
    <div class="np">
      <span class="lang" id="npLang">—</span>
      <div class="tt"><b id="npTitle">Choose a chapter to begin</b><small id="npSub">Tap any chapter number in the list.</small></div>
      <div class="ctl"><button id="prevT" aria-label="Previous">⏮</button><button class="big" id="playT" aria-label="Play">▶</button><button id="nextT" aria-label="Next">⏭</button><button id="moreT" aria-label="More" class="icon">⌃</button></div>
    </div>
    <div class="seek"><span id="tCur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Position"><span id="tDur">0:00</span></div>
    <div class="more">
      <label>Languages <select id="langs">
        <option value="ru,en,lt">RU → EN → LT</option><option value="ru,lt,en">RU → LT → EN</option><option value="en,ru,lt">EN → RU → LT</option><option value="lt,ru,en">LT → RU → EN</option>
        <option value="ru,en">RU → EN</option><option value="en,ru">EN → RU</option><option value="ru,lt">RU → LT</option><option value="lt,ru">LT → RU</option><option value="en,lt">EN → LT</option>
        <option value="ru">Russian only</option><option value="en">English only</option><option value="lt">Lithuanian only</option></select></label>
      <label>Then <select id="mode"><option value="next">next chapter</option><option value="book">stop at end of book</option><option value="stop">stop</option></select></label>
      <label>Speed <select id="rate"><option>0.8</option><option>0.9</option><option selected>1</option><option>1.1</option><option>1.25</option><option>1.5</option></select></label>
      <label><input type="checkbox" id="follow" checked> Show text of the language playing</label>
    </div>
  </div>
  <audio id="au" preload="auto" playsinline></audio>
</div>

<div id="sheetWrap" hidden><div class="scrim" id="scrim"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
/* =====================================================================
   DATA
   ===================================================================== */
const AZ='https://media.azbyka.ru/audio/Svjashhennoe_pisanie/';
const EB='https://ebible.org/eng-web/audio/';
const pad=(n,w)=>String(n).padStart(w,'0');
const ONES=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
const TENS=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
const words=n=>n>=100?'One Hundred'+(n>100?' '+words(n-100):''):n<20?ONES[n]:TENS[Math.floor(n/10)]+(n%10?' '+ONES[n%10]:'');

/* English audio (World English Bible, read by Winfred Henson, ebible.org). File names verified against the site's listings. */
const EN_FOLDERS=['01_Genesis','02_Exodus','03_Leviticus','04_Numbers','05_Deuteronomy','06_Joshua','07_Judges','08_Ruth','09_First_Samuel','10_Second_Samuel','11_First_Kings','12_Second_Kings','13_First_Chronicles','14_Second_Chronicles','15_Ezra','16_Nehemiah','17_Esther','18_Job','19_Psalms','20_Proverbs','21_Ecclesiastes','22_Song_of_Solomon','23_Isaiah','24_Jeremiah','25_Lamentations','26_Ezekiel','27_Daniel','28_Hosea','29_Joel','30_Amos','31_Obadiah','32_Jonah','33_Micah','34_Nahum','35_Habakkuk','36_Zephaniah','37_Haggai','38_Zechariah','39_Malachi','40_Matthew','41_Mark','42_Luke','43_John','44_Acts','45_Romans','46_First_Corinthians','47_Second_Corinthians','48_Galatians','49_Ephesians','50_Philippians','51_Colossians','52_First_Thessalonians','53_Second_Thessalonians','54_First_Timothy','55_Second_Timothy','56_Titus','57_Philemon','58_Hebrews','59_James','60_First_Peter','61_Second_Peter','62_First_John','63_Second_John','64_Third_John','65_Jude','66_Revelations'];
const EN_SEQ0=[1,1,1,1,1,1,1,1,37,268,292,314,339,368,404,414,427,437,479,629,660,672,680,745,797,802,850,862,876,879,888,889,893,900,903,906,909,911,925,929,957,973,997,1018,1046,1062,1078,1091,1097,1103,1107,1111,1116,1119,1125,1129,1132,1133,1146,1151,1156,1159,1164,1165,1166,1167];
const EN_NO01=new Set([14,15,19,20,21,22,41,43,60]);
function enAudio(b,c){ // b = 1..66 (Protestant order), c = chapter
  const f=EN_FOLDERS[b-1];if(!f)return null;const base=EB+f+'/';
  if(b<=9)return base+encodeURIComponent(`${pad(b,2)}_${pad(EN_SEQ0[b-1]+c-1,2)}_${f.slice(3)}_Chapter_${words(c).replace(/ /g,'_')}.mp3`);
  let seq=EN_SEQ0[b-1]+c-1; if(b===23&&c>=17)seq-=1;
  const tok=f.slice(3).replace(/_/g,' ');let name;
  if(b===19)name=`${pad(seq,4)} Psalms-${words(c)}.mp3`;
  else if(b===20)name=`${pad(seq,4)} Proverbs-Chapter ${pad(c,3)}.mp3`;
  else if(b===44&&c===13)name=`01 1030 Acts-Chapter Thirteen 1.mp3`;
  else if(b===53&&c===3)name=`01  1118 Second Thessalonians-Chapter Three.mp3`;
  else name=`${EN_NO01.has(b)?'':'01 '}${pad(seq,4)} ${tok}-Chapter ${words(c)}.mp3`;
  return base+encodeURIComponent(name);
}
/* Russian audio (Synodal translation read by Ilya Prudovsky, azbyka.ru) */
const ruPat=(dir,pre,ext='.mp3',w=2)=>c=>AZ+'biblija_prudovskij/'+dir+'/'+pre+pad(c,w)+ext;
const NT_SEQ={MAT:['Mth',1,2],MRK:['Mk',29,0],LUK:['Lk',45,0],JHN:['In',69,0],ACT:['Acts',90,2],JAS:['James',118,2],'1PE':['1_Peter',123,2],'2PE':['2_Peter',128,2],'1JN':['1_John',131,2],'2JN':['2_John',136,2],'3JN':['3_John',137,2],JUD:['Jude',138,2],ROM:['Romans',139,2],'1CO':['1_Corinthians',155,2],'2CO':['2_Corinthians',171,2],GAL:['Galatians',184,2],EPH:['Ephesians',190,2],PHP:['Philippians',196,2],COL:['Colossians',200,2],'1TH':['1_Thessalonians',204,2],'2TH':['2_Thessalonians',209,2],'1TI':['1_Timothy',212,2],'2TI':['2_Timothy',218,2],TIT:['Titus',222,2],PHM:['Philemon',225,2],HEB:['Hebrews',226,2],REV:['Revelation',239,2]};
const ruNT=code=>c=>{const [tok,s0,w]=NT_SEQ[code];const s=s0+c-1;return AZ+'biblija_prudovskij/novyj-zavet/'+(s<100?pad(s,3):'0'+s)+'_'+tok+'_'+(w?pad(c,w):c)+'.mp3'};

/* Books: code, English, Russian, Lithuanian, chapters, Protestant number (for English/Lithuanian audio and jw.org), Russian audio pattern, text codes, extras */
const SEC=[
 ['Pentateuch · Пятикнижие',[
  ['GEN','Genesis','Бытие','Pradžios',50,1,ruPat('bytija','Genesis_','.MP3')],
  ['EXO','Exodus','Исход','Išėjimo',40,2,ruPat('Ishod','Exodus-')],
  ['LEV','Leviticus','Левит','Kunigų',27,3,ruPat('Levit','Leviticus-')],
  ['NUM','Numbers','Числа','Skaičių',36,4,ruPat('Chisel','Numbers-')],
  ['DEU','Deuteronomy','Второзаконие','Pakartoto Įstatymo',34,5,ruPat('Vtorozakonie','Deuteronomy_')]]],
 ['Historical books · Исторические книги',[
  ['JOS','Joshua','Иисус Навин','Jozuės',24,6,ruPat('I-navin','Joshua_')],
  ['JDG','Judges','Судьи','Teisėjų',21,7,ruPat('Sudej','Judges_')],
  ['RUT','Ruth','Руфь','Rūtos',4,8,ruPat('Rufi','Ruth_')],
  ['1SA','1 Samuel','1 Царств','1 Samuelio',31,9,ruPat('carstv-1','1-carstv-')],

/* Synodal psalm number → Hebrew/English psalm numbers */
function psHeb(n){if(n<=8)return[n];if(n===9)return[9,10];if(n<=112)return[n+1];if(n===113)return[114,115];if(n===114)return[116];if(n===115)return[];if(n<=145)return[n+1];if(n===146)return[147];if(n===147)return[];if(n<=150)return[n];return[]}

/* Build the unit list (chapters + extras) for every book */
const BOOKS=[];const BY={};
for(const [secName,list] of SEC){
  const sec={name:secName,books:[]};
  for(const [code,en,ru,lt,n,pb,ruFn,opt={}] of list){
    const units=[];
    const mk=(id,label,o)=>({id:String(id),label:String(label),...o});
    for(const p of (opt.pre||[]))units.push(mk(p.id,p.label,{ru:p.ru,enName:p.en,extra:true}));
    for(let c=1;c<=n;c++){
      const u=mk(c,c,{ru:ruFn(c)});
      if(opt.psalms){const hs=psHeb(c);u.heb=hs;u.en=hs.map(h=>enAudio(19,h));u.lt=hs.map(h=>[19,h]);u.ruText=[code,c-1];u.enText=hs.map(h=>[code,h-1]);u.ltText=hs.map(h=>[code,h-1]);
        if(c===115)u.covered='114';if(c===147)u.covered='146';}
      else{const okEn=pb&&(!opt.enMax||c<=opt.enMax);u.en=okEn?[enAudio(pb,c)]:[];u.lt=okEn?[[pb,c]]:[];
        u.ruText=opt.noText?null:[code,c-1];u.enText=okEn||opt.dc?[[code,c-1]]:[];u.ltText=okEn?[[code,c-1]]:[];
        if(opt.dc){u.ruText=null;}}
      units.push(u);
    }
    if(opt.psalms)units.push(mk(151,151,{en:[],lt:[],enText:[['PS2',0]],ltText:[],ruText:null,extra:true}));
    for(const e of (opt.extras||[]))units.push(mk(e.id,e.label,{ru:e.ru,enName:e.en,en:[],lt:[],enText:e.enText?[e.enText]:[],ltText:[],ruText:null,extra:true}));
    const bk={code,en,ru,lt,n,pb,sec,units,dc:!!opt.dc,psalms:!!opt.psalms};
    units.forEach((u,i)=>{u.book=bk;u.idx=i;u.key=code+'|'+u.id});
    sec.books.push(bk);BOOKS.push(bk);BY[code]=bk;
  }
  SEC.sec=SEC.sec||[];SEC.sec.push(sec);
}

  if(u.extra)return lang==='en'?(u.enName||u.label):u.label;

const LT_CACHE={};
async function ltList(b){
  if(LT_CACHE[b])return LT_CACHE[b];
  let m=null;try{m=JSON.parse(localStorage.getItem('lt-'+b)||'null')}catch(e){}
  if(!m){const r=await fetch('https://b.jw-cdn.org/apis/pub-media/GETPUBMEDIALINKS?output=json&pub=nwt&fileformat=MP3&alllangs=0&langwritten=L&txtCMSLang=L&booknum='+b);
    if(!r.ok)throw new Error('lt '+r.status);const j=await r.json();const list=(((j.files||{}).L||{}).MP3)||[];m={};
    for(const e of list){if(e.track&&e.file&&e.file.url&&(e.bibleBookNumber==null||e.bibleBookNumber===b)&&!m[e.track])m[e.track]=e.file.url}
    try{localStorage.setItem('lt-'+b,JSON.stringify(m))}catch(e){}}
  LT_CACHE[b]=m;return m;}
async function ltUrl(b,c){try{const m=await ltList(b);return m[c]||null}catch(e){return null}}

  return TXT[k];}
function textRefs(u,lang){if(lang==='ru')return u.ruText?[u.ruText]:[];if(lang==='en')return u.enText||[];return u.ltText||[];}

function nextTrack(){if(!P.u)return;if(P.ti<P.tracks.length-1)playTrack(P.ti+1);else unitDone()}
function prevTrack(){if(!P.u)return;if(au.currentTime>4){au.currentTime=0;return}if(P.ti>0)playTrack(P.ti-1);else{const pv=ALL_UNITS[P.u.gi-1];if(pv)startUnit(pv)}}
$('playT').onclick=togglePlay;$('nextT').onclick=nextTrack;$('prevT').onclick=prevTrack;
$('moreT').onclick=()=>{const p=$('player');p.classList.toggle('open');$('moreT').textContent=p.classList.contains('open')?'⌄':'⌃';fitPlayer()};
function fitPlayer(){const h=$('player').getBoundingClientRect().height;document.documentElement.style.setProperty('--player-h',Math.ceil(h)+'px')}
window.addEventListener('resize',fitPlayer);
if('mediaSession' in navigator){const ms=navigator.mediaSession;const set=(a,f)=>{try{ms.setActionHandler(a,f)}catch(e){}};
  set('play',()=>au.play().catch(()=>{}));set('pause',()=>au.pause());set('nexttrack',nextTrack);set('previoustrack',prevTrack);
  set('seekbackward',d=>{au.currentTime=Math.max(0,au.currentTime-(d.seekOffset||15))});set('seekforward',d=>{au.currentTime=Math.min(au.duration||1e9,au.currentTime+(d.seekOffset||15))});
  set('seekto',d=>{if(d.seekTime!=null)au.currentTime=d.seekTime});}
/* settings */
$('langs').value=S.langs;$('mode').value=S.mode;$('rate').value=String(S.rate);$('follow').checked=S.follow!==false;
$('langs').onchange=()=>{S.langs=$('langs').value;store.save();if(!P.u)return;const cur=P.tracks[P.ti];const fresh=tracksFor(P.u);
  const key=t=>t.lang+':'+(t.part||0);const played=P.tracks.slice(0,P.ti);const done=new Set(played.map(key));
  const rest=fresh.filter(t=>!done.has(key(t))&&(!cur||key(t)!==key(cur)));
  P.tracks=cur?[...played,cur,...rest]:rest;P.ti=cur?played.length:0;setNow(cur||null);renderTabs();};
$('mode').onchange=()=>{S.mode=$('mode').value;store.save();if(P.u)setNow(P.tracks[P.ti])};
$('rate').onchange=()=>{S.rate=parseFloat($('rate').value)||1;au.playbackRate=S.rate;store.save()};
$('follow').onchange=()=>{S.follow=$('follow').checked;store.save()};

/* =====================================================================
   LIBRARY
   ===================================================================== */
const lastUnit=()=>{const l=S.last;if(!l||!BY[l.b])return null;return BY[l.b].units.find(u=>u.id===l.u)||null};
function heardCount(b){return b.units.filter(u=>S.heard[u.key]).length}
function renderLibrary(){
  const secs=$('sections');secs.innerHTML=SEC.sec.map((sec,si)=>`<details class="sec" data-si="${si}"${S.open[si]?' open':''}><summary><h2>${esc(sec.name)}</h2><span class="cnt" id="sc${si}"></span></summary>
   ${sec.books.map(b=>`<div class="book" data-b="${b.code}"><div class="row" role="button" tabindex="0" aria-expanded="false"><div class="nm"><b>${esc(b.en)}<span class="avail" title="Recordings: Russian / English / Lithuanian"><i class="ru on"></i><i class="en${b.pb?' on':''}"></i><i class="lt${b.pb?' on':''}"></i></span></b><small>${esc(b.ru)}${b.lt?' · '+esc(b.lt):''}</small></div><span class="st" id="st-${b.code}"></span></div><div class="chips" hidden></div></div>`).join('')}</details>`).join('');
  secs.querySelectorAll('details.sec').forEach(d=>d.addEventListener('toggle',()=>{S.open[d.dataset.si]=d.open?1:0;store.save()}));
  secs.addEventListener('click',e=>{const row=e.target.closest('.row');if(row){toggleBook(row.parentElement);return}
    const ch=e.target.closest('.ch');if(ch){const u=BY[ch.dataset.b].units[+ch.dataset.i];if(P.u===u){togglePlay()}else startUnit(u)}});
  secs.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('row')){e.preventDefault();toggleBook(e.target.parentElement)}});
  paintProgress();renderContinue();}
function toggleBook(bookEl,force){const chips=bookEl.querySelector('.chips');const open=force!==undefined?force:chips.hidden;
  chips.hidden=!open;bookEl.querySelector('.row').setAttribute('aria-expanded',open);
  if(open&&!chips.dataset.ready){const b=BY[bookEl.dataset.b];chips.innerHTML=b.units.map(u=>`<button class="ch" data-b="${b.code}" data-i="${u.idx}" aria-label="${esc(unitTitle(u,'en'))}">${esc(u.extra&&u.id!=='151'?u.id:u.label)}</button>`).join('');chips.dataset.ready=1;paintChips(b)}}
function paintChips(b){const el=document.querySelector(`.book[data-b="${b.code}"] .chips`);if(!el||!el.dataset.ready)return;
  el.querySelectorAll('.ch').forEach(c=>{const u=b.units[+c.dataset.i];c.classList.toggle('done',!!S.heard[u.key]);c.classList.toggle('now',P.u===u);
    const best=S.best[u.key];if(best)c.dataset.best=best;else delete c.dataset.best;c.classList.toggle('hasq',S.qs.some(q=>q.b===b.code&&q.u===u.id))})}
function updateChipNow(){document.querySelectorAll('.ch.now').forEach(c=>c.classList.remove('now'));if(P.u){const c=document.querySelector(`.ch[data-b="${P.u.book.code}"][data-i="${P.u.idx}"]`);if(c)c.classList.add('now')}}
function paintProgress(){let T=0,H=0;
  SEC.sec.forEach((sec,si)=>{let t=0,h=0;sec.books.forEach(b=>{const n=b.units.length,k=heardCount(b);t+=n;h+=k;const st=$('st-'+b.code);if(st){st.textContent=k===n?'✓ finished':k?k+' / '+n:n+(n===1?' chapter':' chapters');st.classList.toggle('done',k===n)}});
    T+=t;H+=h;const sc=$('sc'+si);if(sc)sc.textContent=h+' / '+t});
  $('prog').style.width=(T?H/T*100:0)+'%';document.querySelector('.top h1').title=H+' of '+T+' chapters heard';
  BOOKS.forEach(paintChips);}
function renderContinue(){const c=$('cont');const u=lastUnit();
  if(u){const l=S.last;const tr=tracksFor(u)[l.ti||0];c.innerHTML=`<div class="t"><small>Continue</small><b>${esc(unitTitle(u,'en'))} · ${esc(unitTitle(u,'ru'))}</b><small>${tr?tr.lang.toUpperCase()+(l.t?' · '+fmt(l.t):''):''}</small></div><button class="primary" id="resume">▶ Resume</button><button id="openCont">Open text</button>`;
    $('resume').onclick=()=>startUnit(u,l.ti||0,l.t||0);$('openCont').onclick=()=>openReader(u,{focus:true});}
  else c.innerHTML=`<div class="t"><small>Where to start</small><b>Mark → Matthew → Luke → John → Acts, then Genesis and the Psalms.</b><small>Every chapter plays in Russian, then English, then Lithuanian. Tap a chapter number to begin.</small></div><button class="primary" id="startMark">▶ Start with Mark 1</button>`;
  const sm=$('startMark');if(sm)sm.onclick=()=>startUnit(BY.MRK.units[0]);}

/* =====================================================================
   READER
   ===================================================================== */
const R={u:null,lang:null,sel:null};
function openReader(u,o){o=o||{};const show=o.show!==false;R.u=u;if(!R.lang||!textRefs(u,R.lang).length)R.lang=pickLang(u);
  const rd=$('reader');if(show){rd.removeAttribute('data-hide');$('lib').setAttribute('data-hide','');$('backBtn').hidden=false}
  $('rTitle').textContent=unitTitle(u,'en')+' · '+unitTitle(u,'ru');
  const bits=[];if(u.book.lt)bits.push(unitTitle(u,'lt'));if(u.covered)bits.push('In English and Lithuanian this psalm is part of Psalm '+(u.heb&&u.heb.length?u.heb.join('–'):'')+' (played with Synodal Psalm '+u.covered+').');if(u.book.dc)bits.push('Part of the Orthodox canon; no English or Lithuanian recording exists, so this chapter plays in Russian only.');
  $('rSub').textContent=bits.join(' ');
  renderTabs();renderBest();renderText();
  $('prevCh').disabled=!ALL_UNITS[u.gi-1];$('nextCh').disabled=!ALL_UNITS[u.gi+1];
  if(show&&(o.focus||window.innerWidth<900))window.scrollTo({top:0});
  const d=document.querySelector(`.book[data-b="${u.book.code}"]`);if(d){const det=d.closest('details');if(det&&!det.open)det.open=true;toggleBook(d,true)}
  updateChipNow();}
function pickLang(u){for(const L of langsArr())if(textRefs(u,L).length)return L;for(const L of ['ru','en','lt'])if(textRefs(u,L).length)return L;return langsArr()[0]||'ru'}
function closeReader(){$('reader').setAttribute('data-hide','');$('lib').removeAttribute('data-hide');$('backBtn').hidden=true}
$('backBtn').onclick=closeReader;
$('prevCh').onclick=()=>{const u=ALL_UNITS[R.u.gi-1];if(u)P.u?startUnit(u):openReader(u,{focus:true})};
$('nextCh').onclick=()=>{const u=ALL_UNITS[R.u.gi+1];if(u)P.u?startUnit(u):openReader(u,{focus:true})};
function renderTabs(){const u=R.u;if(!u)return;$('tabs').innerHTML=['ru','en','lt'].map(L=>{const has=L==='ru'?!!(u.ruText||u.ru):textRefs(u,L).length>0||(L==='en'?(u.en||[]).length>0:(u.lt||[]).length>0);
  return `<button class="${L}${R.lang===L?' on':''}" data-l="${L}"${has?'':' disabled'}>${L.toUpperCase()}</button>`}).join('');
  $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>showLang(b.dataset.l,true))}
function showLang(L,user){if(!R.u)return;if(R.lang===L)return;if(!user&&!textRefs(R.u,L).length)return;R.lang=L;renderTabs();renderText();if(user){$('follow').checked=false;S.follow=false;store.save()}}
function renderBest(){const u=R.u;const v=S.best[u.key];$('ubest').innerHTML=`<span>Understood this chapter best in</span>`+['ru','en','lt'].map(L=>`<button class="${L}${v===L?' on':''}" data-l="${L}">${L.toUpperCase()}</button>`).join('')+`<span class="muted" id="bestStat"></span>`;
  $('ubest').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(S.best[u.key]===b.dataset.l)delete S.best[u.key];else S.best[u.key]=b.dataset.l;store.save();renderBest();paintChips(u.book)});
  const c={ru:0,en:0,lt:0};for(const k in S.best){if(k.split('|').length===2)c[S.best[k]]++}
  $('bestStat').textContent=(c.ru+c.en+c.lt)?` · so far RU ${c.ru} · EN ${c.en} · LT ${c.lt}`:'';}
async function renderText(){const u=R.u,L=R.lang;const el=$('text');const my=++renderText.tok||(renderText.tok=1);
  const refs=textRefs(u,L);
  if(!refs.length){el.innerHTML=`<p class="note">${L==='ru'?'The Russian text of this chapter is not in the app yet; the recording plays normally.':L==='lt'?'No Lithuanian text for this chapter. The Lithuanian recording (if any) still plays.':'No English text for this chapter.'}</p>`;return}
  el.innerHTML='<p class="muted">Loading text…</p>';
  const parts=await chapterText(u,L);if(my!==renderText.tok)return;
  let h='';
  parts.forEach((p,pi)=>{if(parts.length>1||u.book.psalms&&L!=='ru')h+=`<h3>${esc(L==='en'?(p.code==='PS2'?'Psalm 151':'Psalm '+(p.ci+1)):L==='lt'?(p.ci+1)+' psalmė':'Псалом '+(p.ci+1))}</h3>`;
    if(!p.verses){h+=`<p class="note">Text not available.</p>`;return}
    const empty=p.verses.every(v=>!v||!v.trim());if(empty){h+=`<p class="note">${L==='lt'?'This chapter has not been translated yet in the TPV (the Lithuanian translation is still in progress).':'Text not available.'}</p>`;return}
    p.verses.forEach((v,i)=>{const n=parts.length>1?(p.ci+1)+':'+(i+1):i+1;const vk=u.key+'|'+n;const best=S.best[vk];const hasq=S.qs.some(q=>q.b===u.book.code&&q.u===u.id&&String(q.v)===String(n));
      h+=`<span class="v${v&&v.trim()?'':' missing'}${hasq?' hasq':''}" data-v="${n}" data-p="${pi}"${best?` data-best="${best}"`:''}><sup>${i+1}</sup>${v&&v.trim()?esc(v):'(not translated yet)'}</span> `});});
  if(L==='lt')h+=`<p class="note">Lithuanian text: Tikinčiųjų paveldo vertimas (TPV, CC BY-SA), a translation still in progress, so some chapters are missing. The recording is the New World Translation, a different translation.</p>`;
  el.innerHTML=h;}
$('text').addEventListener('click',e=>{const v=e.target.closest('.v');if(!v)return;const was=v.classList.contains('sel');
  $('text').querySelectorAll('.v.sel').forEach(x=>x.classList.remove('sel'));$('text').querySelectorAll('.vact').forEach(x=>x.remove());
  if(was)return;v.classList.add('sel');const n=v.dataset.v;const u=R.u;const vk=u.key+'|'+n;const best=S.best[vk];
  const bar=document.createElement('div');bar.className='vact';bar.innerHTML=`<span class="muted">Verse ${esc(n)} · understood best in</span>`+['ru','en','lt'].map(L=>`<button class="${L}${best===L?' on':''}" data-l="${L}">${L.toUpperCase()}</button>`).join('')+`<button data-ask="1">? Ask about this verse</button>`;
  bar.querySelectorAll('button[data-l]').forEach(b=>b.onclick=()=>{if(S.best[vk]===b.dataset.l)delete S.best[vk];else S.best[vk]=b.dataset.l;store.save();const nb=S.best[vk];if(nb)v.dataset.best=nb;else delete v.dataset.best;bar.querySelectorAll('button[data-l]').forEach(x=>x.classList.toggle('on',x.dataset.l===nb))});
  bar.querySelector('[data-ask]').onclick=()=>openAsk(u,n);v.after(bar);});

/* =====================================================================
   QUESTIONS, SETTINGS, SYNC (bottom sheet)
   ===================================================================== */
function openSheet(html){$('sheet').innerHTML=`<button class="icon x" id="sheetX" aria-label="Close">✕</button>`+html;$('sheetWrap').hidden=false;$('sheetX').onclick=closeSheet;$('scrim').onclick=closeSheet;document.body.style.overflow='hidden'}
function closeSheet(){$('sheetWrap').hidden=true;document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('sheetWrap').hidden)closeSheet()});
async function versesFor(u,n){const out={};for(const L of ['ru','en','lt']){const parts=await chapterText(u,L);for(const p of parts){const v=p.verses&&p.verses[n-1];if(v&&v.trim()){out[L]=v.trim();break}}}return out}
async function buildPrompt(q){const u=BY[q.b]&&BY[q.b].units.find(x=>x.id===q.u);if(!u)return q.q;
  let p=`I am reading the Bible chapter by chapter in three languages: Russian (Synodal translation), English (World English Bible) and Lithuanian. This is ${unitTitle(u,'en')} (${unitTitle(u,'ru')})${q.v?', verse '+q.v:''}.`;
  if(q.v){const vs=await versesFor(u,+q.v);for(const L of ['ru','en','lt'])if(vs[L])p+=`\n${LANG_NAME[L]}: "${vs[L].slice(0,400)}"`}
  p+=`\n\nPlease explain it clearly and simply, point out where the translations differ, and say how the Orthodox Church traditionally understands this passage. My question: ${q.q}`;return p}
const claudeUrl=p=>'https://claude.ai/new?q='+encodeURIComponent(p);
function openAsk(u,v){openSheet(`<h2>Ask about ${esc(unitTitle(u,'en'))}${v?':'+esc(v):''}</h2><p class="muted" style="margin:0 0 8px">${esc(unitTitle(u,'ru'))}${v?', стих '+esc(v):''}</p>
  <label>Verse <input type="text" id="askV" inputmode="numeric" value="${esc(v||'')}" style="width:80px"></label>
  <p><textarea id="askQ" rows="3" placeholder="Your question, in any language"></textarea></p>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="primary" id="askGo">Save and ask Claude</button><button id="askSave">Save only</button></div>
  <p class="muted" style="font-size:12.5px">Claude opens in a new tab with the verse in all three languages and your question already filled in.</p>`);
  const save=()=>{const t=$('askQ').value.trim();if(!t){toast('Type a question first');return null}const q={b:u.book.code,u:u.id,v:$('askV').value.trim(),q:t,t:Date.now()};S.qs.push(q);store.save();paintChips(u.book);if(R.u===u)renderText();return q};
  $('askSave').onclick=()=>{if(save()){closeSheet();toast('Saved to My questions')}};
  $('askGo').onclick=async()=>{const q=save();if(!q)return;const w=window.open('about:blank','_blank');const p=await buildPrompt(q);if(w)w.location=claudeUrl(p);else location.href=claudeUrl(p);closeSheet()};
  setTimeout(()=>{const q=$('askQ');if(q)q.focus()},50)}
async function openNotes(){const c={ru:0,en:0,lt:0},cv={ru:0,en:0,lt:0};for(const k in S.best){(k.split('|').length===2?c:cv)[S.best[k]]++}
  const items=S.qs.map((q,i)=>{const u=BY[q.b]&&BY[q.b].units.find(x=>x.id===q.u);return `<li><span class="ref">${u?esc(unitTitle(u,'en')):esc(q.b)}${q.v?':'+esc(q.v):''}</span> <span></span><div class="acts"><a href="#" data-ask="${i}">Ask Claude</a><button data-open="${i}">Open chapter</button><button data-copy="${i}">Copy</button><button data-del="${i}">Delete</button></div></li>`}).join('');
  openSheet(`<h2>My questions</h2><div class="stat"><span>Understood best · chapters: <b>RU ${c.ru}</b> · <b>EN ${c.en}</b> · <b>LT ${c.lt}</b></span><span>verses: <b>RU ${cv.ru}</b> · <b>EN ${cv.en}</b> · <b>LT ${cv.lt}</b></span></div>
  ${S.qs.length?`<ul class="qs" id="qsList">${items}</ul>`:'<p class="muted">No questions yet. Open a chapter, tap a verse and choose “Ask about this verse”.</p>'}`);
  const ul=$('qsList');if(!ul)return;ul.querySelectorAll('li').forEach((li,i)=>li.querySelector('span:nth-child(2)').textContent=S.qs[i].q);
  ul.addEventListener('click',async e=>{const a=e.target.closest('[data-ask]');if(a){e.preventDefault();const w=window.open('about:blank','_blank');const p=await buildPrompt(S.qs[+a.dataset.ask]);if(w)w.location=claudeUrl(p);else location.href=claudeUrl(p);return}
    const o=e.target.closest('[data-open]');if(o){const q=S.qs[+o.dataset.open];const u=BY[q.b]&&BY[q.b].units.find(x=>x.id===q.u);if(u){closeSheet();openReader(u,{focus:true})}return}
    const cp=e.target.closest('[data-copy]');if(cp){const p=await buildPrompt(S.qs[+cp.dataset.copy]);try{await navigator.clipboard.writeText(p);toast('Copied')}catch(err){toast('Could not copy')}return}
    const d=e.target.closest('[data-del]');if(d){S.qs.splice(+d.dataset.del,1);store.save();openNotes();BOOKS.forEach(paintChips);if(R.u)renderText()}});}
$('notesBtn').onclick=openNotes;
function openSettings(){const T=ALL_UNITS.length,H=Object.keys(S.heard).length;
  openSheet(`<h2>Settings and progress</h2>
  <div class="stat"><span><b>${H}</b> of <b>${T}</b> chapters heard</span><span><b>${S.qs.length}</b> questions</span></div>
  <h3 style="font-size:16px;margin:12px 0 4px">Move progress to another device</h3>
  <p class="muted" style="margin:0 0 6px;font-size:13px">Progress is saved in this browser only. Copy the code here and paste it on your other device to merge.</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button id="expBtn">Copy my progress code</button><button id="impBtn">Paste a code</button></div>
  <p><textarea id="syncBox" rows="3" hidden></textarea></p>
  <h3 style="font-size:16px;margin:16px 0 4px">Data</h3>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button id="clearLt">Refresh Lithuanian links</button><button id="resetAll">Clear all progress</button></div>
  <h3 style="font-size:16px;margin:16px 0 4px">About the recordings and texts</h3>
  <p class="muted" style="font-size:13px;margin:0">Russian: Synodal translation, all 77 books of the Orthodox Bible, read by Ilya Prudovsky (azbyka.ru). English: World English Bible, read by Winfred Henson (ebible.org); text is the WEB Updated edition, with the deuterocanonical books. Lithuanian: audio is the New World Translation (jw.org); text is the Tikinčiųjų paveldo vertimas (CC BY-SA), still in progress. Psalms follow the Russian (Synodal) numbering; English and Lithuanian switch to the matching psalm.</p>`);
  $('expBtn').onclick=async()=>{const code=btoa(unescape(encodeURIComponent(JSON.stringify({heard:S.heard,best:S.best,qs:S.qs,last:S.last}))));const box=$('syncBox');box.hidden=false;box.value=code;try{await navigator.clipboard.writeText(code);toast('Copied. Paste it on the other device.')}catch(e){box.select();toast('Select the code and copy it')}};
  $('impBtn').onclick=()=>{const box=$('syncBox');box.hidden=false;box.value='';box.placeholder='Paste the code here, then tap Paste a code again';box.focus();
    $('impBtn').onclick=()=>{try{const o=JSON.parse(decodeURIComponent(escape(atob(box.value.trim()))));let n=0;for(const k in o.heard||{}){if(!S.heard[k]){S.heard[k]=1;n++}}Object.assign(S.best,o.best||{});
      for(const q of o.qs||[]){if(!S.qs.some(x=>x.t===q.t&&x.q===q.q))S.qs.push(q)}if(o.last&&!S.last)S.last=o.last;store.save();paintProgress();renderContinue();toast('Merged: '+n+' new chapters');closeSheet()}catch(e){toast('That code could not be read')}}};
  $('clearLt').onclick=()=>{for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);if(k&&k.startsWith('lt-'))localStorage.removeItem(k)}for(const k in LT_CACHE)delete LT_CACHE[k];toast('Lithuanian links will be fetched again')};
  $('resetAll').onclick=()=>{$('resetAll').textContent='Tap again to confirm';$('resetAll').onclick=()=>{S.heard={};S.best={};S.qs=[];S.last=null;store.save();paintProgress();renderContinue();closeSheet();toast('Progress cleared')}};}
$('setBtn').onclick=openSettings;

/* =====================================================================
   BOOT
   ===================================================================== */
$('credits').textContent='Русский: Синодальный перевод, читает Илья Прудовский (azbyka.ru). English: World English Bible, read by Winfred Henson (ebible.org). Lietuviškai: Naujojo pasaulio vertimas (jw.org); tekstas – Tikinčiųjų paveldo vertimas.';
renderLibrary();
(function(){const u=lastUnit();if(u){const det=document.querySelector(`.book[data-b="${u.book.code}"]`);if(det){det.closest('details').open=true;toggleBook(det,true)}}else{const d=document.querySelector('details.sec[data-si="5"]');if(d)d.open=true}})();
setPlayIcon();fitPlayer();window.addEventListener('load',fitPlayer);setTimeout(fitPlayer,600);
window.__app={S,P,BOOKS,BY,ALL_UNITS,startUnit,tracksFor,enAudio,psHeb,unitTitle,openReader,renderText,store};
</script>
</body>
</html>
